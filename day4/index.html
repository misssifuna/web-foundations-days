<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes - Character Counter</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="container">
      <h1>QuickNotes</h1>
      <p>Write a note below. Your draft is saved automatically.</p>

      <label for="note-text">Your note (maximum 200 characters)</label>
      <textarea
        id="note-text"
        rows="8"
        maxlength="200"
        placeholder="Start typing your note..."
      ></textarea>

      <p id="char-count">0 / 200 characters</p>
      <p id="word-count">0 words</p>

      <div class="actions">
        <button id="clear-btn" type="button">Clear</button>
        <button id="theme-toggle" type="button">Dark mode</button>
      </div>
    </main>
  </body>
</html>
